<!DOCTYPE html>
<html lang="en">

<head>
    <title>data collection</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="./css/bootstrap.css" rel="stylesheet">
    <script src="./js/bootstrap.bundle.js"></script>

    <script src="./js/main.js" defer></script>
</head>

<body>
    <div class="container p-5 m-5 border">
        <h4><u>boostsrap</u></h4>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>type</th>
                    <th>value</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <select class="form-select" id="input-data-type" name="data-type"></select>
                    </td>
                    <td>
                        <input class="form-control" id="input-data-value" placeholder="input data" name="data-input">
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <hr>

    <div class="container p-5 m-5 border">
        <h4 id="output:"><u>data to submit:</u></h4>

        <table class="table table-bordered" id="output-table">
            <thead>
                <tr>
                    <th>type</th>
                    <th>value</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <button type="button" class="btn btn-primary px-4 py-3">submit data</button>
    </div>

    <hr>

    <div class="container p-5 m-5 border">
        <h4><u>settings</u></h4>

        <div class="form-check form-switch pt-3">
            <input class="form-check-input" type="checkbox" id="dark-mode">
            <label class="form-check-label" for="dark-mode">dark mode</label>
        </div>

        <p class="text-muted fst-italic">why would you ever have this off??</p>
    </div>
</body>
